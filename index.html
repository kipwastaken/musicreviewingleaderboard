<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Classement d'Albums</title>
    <!-- Import de la bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Leaderboard / Classement Général</h1>
    <div id="status">Chargement des albums...</div>

    <table id="rankings-table" style="display: none;">
        <thead>
            <tr>
                <th>Position</th>
                <th>Artiste</th>
                <th>Album</th>
                <th>Année</th>
                <th>Moyenne</th>
            </tr>
        </thead>
        <tbody id="rankings-body">
            <!-- Les albums s'afficheront ici automatiquement -->
        </tbody>
    </table>

    <script>
        // 1. CONFIGURATION (Remplacez par vos identifiants Supabase)
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. CHARGEMENT DES DONNÉES DE LA VUE SUPABASE
        async function loadLeaderboard() {
            const statusEl = document.getElementById('status');
            const tableEl = document.getElementById('rankings-table');
            const tbodyEl = document.getElementById('rankings-body');

            // On interroge la vue 'album_rankings' créée dans le premier script SQL
            const { data: albums, error } = await supabaseClient
                .from('album_rankings')
                .select('*')
                .order('average_score', { ascending: false });

            if (error) {
                statusEl.innerText = "Erreur lors du chargement : " + error.message;
                return;
            }

            if (!albums || albums.length === 0) {
                statusEl.innerText = "Aucun album trouvé dans la base de données. Ajoutez-en un via Supabase !";
                return;
            }

            statusEl.style.display = 'none';
            tableEl.style.display = 'table';
            tbodyEl.innerHTML = '';

            // Affichage de chaque album dans le tableau
            albums.forEach((album, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>#${index + 1}</td>
                    <td>${album.artist_name || 'Inconnu'}</td>
                    <td><b>${album.title}</b></td>
                    <td>${album.release_year || '----'}</td>
                    <td>${Number(album.average_score).toFixed(1)} / 100 (${album.total_ratings} votes)</td>
                `;
                tbodyEl.appendChild(row);
            });
        }

        // Lancement au chargement de la page
        loadLeaderboard();
    </script>

</body>
</html>
